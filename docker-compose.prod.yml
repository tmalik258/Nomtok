services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: nomtok_backend_prod
    ports:
      - "8030:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - YTDLP_UPDATER_ENABLED=true
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - NOTIFY_EMAILS=${NOTIFY_EMAILS}
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/cookies:/code/cookies
      - ./backend/logs:/code/logs
    depends_on:
      - redis
      - tor
    networks:
      - nomtok-network
    restart: always
    mem_limit: 3g
    mem_reservation: 512m
    cpus: 1.5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        # Use a placeholder URL during build - backend is not accessible
        # Real sitemaps are generated at container startup via start-with-sitemaps.js
        - NEXT_PUBLIC_API_URL=http://backend:8000
        - NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID}
    container_name: nomtok_frontend_prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_SITE_URL=https://nomtok.com
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    networks:
      - nomtok-network
    restart: always
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  redis:
    image: redis:alpine
    container_name: nomtok_redis_prod
    ports:
      - "6382:6379"
    volumes:
      - redis_data:/data
    networks:
      - nomtok-network
    restart: always
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.5
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru

  tor:
    image: peterdavehello/tor-socks-proxy:latest
    container_name: nomtok_tor_prod
    networks:
      - nomtok-network
    restart: unless-stopped

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: nomtok_bgutil_provider_prod
    ports:
      - "4416:4416"
    networks:
      - nomtok-network
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4416/ping', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  nomtok-network:
    driver: bridge

volumes:
  redis_data: